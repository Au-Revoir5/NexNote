name: nexnote
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.4
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.5.2
  flutter_dotenv: ^6.0.0
  google_sign_in: ^6.1.5
  url_launcher: ^6.2.1
  open_filex: ^4.3.4
